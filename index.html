<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Zayaka Cake Logger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded without blocking the first paint. As a plain stylesheet this sat
      in front of every pixel: on a weak phone signal the screen stayed empty
      until a third-party domain answered. Now the page draws immediately in
      the fallback face and swaps when the webfont lands.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>" />

    <!-- installable on a phone home screen -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#e890a0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171315" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zayaka" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Log every custom cake, never miss a pickup, and see exactly how the business is doing." />
  </head>
  <body>
    <!--
      A first paint that costs nothing to fetch.

      #root was empty, so the screen stayed blank until ~270kB of JavaScript
      had downloaded and parsed — on a phone that reads as the app being
      broken. This is inline, so it draws the moment the HTML lands, and
      React replaces it on mount. Styles are inline too: it must not wait on
      the stylesheet either.
    -->
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Zayaka">
        <div class="boot-mark" aria-hidden="true">🎂</div>
        <div class="boot-name">Zayaka</div>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #f7f2ee;
        color: #2b2224;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .boot-mark { font-size: 40px; line-height: 1; }
      .boot-name { font-size: 20px; font-weight: 600; letter-spacing: 0.01em; }
      .boot-bar {
        width: 132px;
        height: 3px;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #e890a0;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(330%); }
      }
      @media (prefers-color-scheme: dark) {
        .boot { background: #171315; color: #f2e9e6; }
        .boot-bar { background: rgba(255, 255, 255, 0.14); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar span { animation: none; width: 100%; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
