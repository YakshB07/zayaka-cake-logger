name: Keep the app awake

# Render's free tier stops the container after 15 minutes with no traffic, and
# starting it again takes the best part of a minute — which is why opening the
# app cold felt broken. A request every 10 minutes keeps it up.
#
# The window is 6am–midnight Toronto, which is when anyone would actually open
# it. That is ~18 hours a day, or roughly 540 of the free tier's 750 instance
# hours a month, leaving headroom. Widen it by editing the hours below; running
# it around the clock would use ~730 hours and leave almost none spare.
#
# Cron here is UTC. Toronto is UTC-4 in summer (EDT) and UTC-5 in winter (EST),
# so the window is set wide enough to cover both without changing twice a year.
on:
  schedule:
    - cron: '*/10 10-23,0-5 * * *'
  workflow_dispatch: {}

# A slow run should never pile up behind the next one.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the app
        run: |
          if [ -z "${{ vars.RENDER_URL }}" ]; then
            echo "RENDER_URL repository variable is not set — nothing to ping."
            echo "Add it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          # -m 90 because a cold start can genuinely take that long; the point
          # of this request is to absorb that wait so the owner never does.
          curl -sS -m 90 -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' \
            "${{ vars.RENDER_URL }}/api/health" \
            --retry 3 --retry-delay 20 --retry-all-errors
